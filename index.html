<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css"/>
  <title>Hoverboard</title>
</head>
<body>
  <div class="controls">
    <div class="control-group">
      <h4>Palettes</h4>
      <button class="palette-btn active" data-palette="neon">Neon</button>
      <button class="palette-btn" data-palette="ocean">Ocean</button>
      <button class="palette-btn" data-palette="fire">Fire</button>
    </div>
    <div class="control-group">
      <h4>Mode</h4>
      <button class="control-btn" id="draw-btn">Draw</button>
      <button class="control-btn active" id="overwrite-btn">Overwrite</button>
      <button class="control-btn" id="rainbow-btn">Rainbow</button>
      <button class="control-btn" id="click-btn">Click Mode</button>
      <button class="control-btn" id="clear-btn">Clear</button>
    </div>
    <div class="control-group">
      <h4>Grid Size</h4>
      <input type="range" min="1" max="2000" value="500" id="size-slider">
      <input type="number" min="1" max="2000" value="500" id="size-input">
    </div>
    <div class="control-group">
      <h4>Trail</h4>
      <input type="range" min="0.1" max="10" value="2" step="0.1" id="trail-slider">
      <input type="number" min="0.1" max="10" step="0.1" value="2" id="trail-input">
      <span class="unit">s</span>
    </div>
  </div>

  <div class="container" id="container">
  </div>

  <script src="script.js"></script>
</body>
</html>
